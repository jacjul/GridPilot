services:
  edge:
    image: nginx:1.27-alpine
    container_name: gridpilot_edge
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: gridpilot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridpilot}
      POSTGRES_USER: ${POSTGRES_USER:-gridpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridpilot} -d ${POSTGRES_DB:-gridpilot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: gridpilot_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gridpilot_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    depends_on:
      api:
        condition: service_healthy
      postgres_exporter:
        condition: service_started
      redis_exporter:
        condition: service_started
      alertmanager:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: gridpilot_alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: gridpilot_postgres_exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-gridpilot}:${POSTGRES_PASSWORD:-gridpilot}@postgres:5432/${POSTGRES_DB:-gridpilot}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:v1.64.0
    container_name: gridpilot_redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: gridpilot_grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_LOG_MODE: console
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridpilot_api
    environment:
      ENV: ${ENV:-prod}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      REDIS_URL_AUTH: ${REDIS_URL_AUTH:-redis://redis:6379/0}
      REDIS_URL_CELERY: ${REDIS_URL_CELERY:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_MIN: ${ACCESS_TOKEN_MIN:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      SAMESITE_COOKIE: ${SAMESITE_COOKIE:-lax}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"
    expose:
      - "8000"
    restart: unless-stopped

 
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gridpilot_frontend
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridpilot_celery_worker
    command: ["celery", "-A", "app.core.celery_worker:celery", "worker", "--loglevel=info", "--concurrency=1"]
    environment:
      ENV: ${ENV:-prod}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://gridpilot:gridpilot@postgres:5432/gridpilot}
      REDIS_URL_CELERY: ${REDIS_URL_CELERY:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy 
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridpilot_celery_beat
    command: ["celery", "-A", "app.core.celery_worker:celery", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      ENV: ${ENV:-prod}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://gridpilot:gridpilot@postgres:5432/gridpilot}
      REDIS_URL_CELERY: ${REDIS_URL_CELERY:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:



