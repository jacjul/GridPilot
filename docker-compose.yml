services:
  edge:
    image: nginx:1.27-alpine
    container_name: gridpilot_edge
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: gridpilot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridpilot}
      POSTGRES_USER: ${POSTGRES_USER:-gridpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridpilot} -d ${POSTGRES_DB:-gridpilot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: gridpilot_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridpilot_api
    environment:
      ENV: ${ENV:-prod}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://gridpilot:gridpilot@postgres:5432/gridpilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_MIN: ${ACCESS_TOKEN_MIN:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      SAMESITE_COOKIE: ${SAMESITE_COOKIE:-lax}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gridpilot_frontend
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
