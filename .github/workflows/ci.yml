name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend-unit:
    name: Backend Unit and Route Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run non-integration tests
        run: pytest tests -q -k "not integration"

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Start integration dependencies
        run: docker compose -f docker-compose.integration.yml up -d --wait

      - name: Run integration tests
        env:
          RUN_INTEGRATION: "1"
          DATABASE_URL: postgresql://gridpilot:gridpilot@127.0.0.1:5433/gridpilot_test
          REDIS_URL: redis://127.0.0.1:6380/0
        run: pytest tests/integration -q

      - name: Tear down integration dependencies
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v