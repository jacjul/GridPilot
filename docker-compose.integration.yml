services:
  postgres:
    image: postgres:16
    container_name: gridpilot_test_postgres
    environment:
      POSTGRES_DB: gridpilot_test
      POSTGRES_USER: gridpilot
      POSTGRES_PASSWORD: gridpilot
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridpilot -d gridpilot_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: gridpilot_test_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
